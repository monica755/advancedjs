 ///Task-3   
 let price = 5000;

let discountPromise = new Promise((resolve, reject) => {
    if (price <= 0) {
        reject("Price must be greater than zero");
    } else {
        let discount = price * 10 / 100;
        let discountedPrice = price - discount;

        resolve(discountedPrice);
    }
});

discountPromise
    .then((result) => {
        console.log("Discounted Price: " + result);
    })
    .catch((error) => {
        console.log("Error: " + error);
    })
    .finally(() => {
        console.log("Price calculation completed");
    });

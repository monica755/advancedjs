<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<div id="showdata">
    </div>

    <script>

     const getDatas = async ()=>{

        const showing = document.getElementById("showdata")
         
        try{
            
        const getdata = await fetch("https://jsonplaceholder.typicode.com/users") 

        console.log(getdata)

        if(!getdata.ok){
            throw new Error("http"+getdata.status)
            return 
        }
       
        const change = await getdata.json()

        let users = change
 console.log(users)

        let myDatas = ""

           users.forEach(element => {

            myDatas += `<h2>
                
              UserName :  ${element.name}
                
                </h2>`
            
           });

              showing.innerHTML = myDatas
              
        }catch(e){
              console.log(e);
   
        }
    }
    getDatas()



    </script>
</body>
</html>























    </script>
